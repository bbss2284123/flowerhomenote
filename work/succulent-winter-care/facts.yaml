facts:
  - id: F1
    value: "사막선인장과 다육식물은 겨울에 흙을 거의 말리는 것이 안전. 다육식물은 화분 흙 대부분이 말랐을 때 정해진 양으로 관수, 겨울엔 물주기를 거의 하지 않는 것이 안전. 모든 식물은 휴식 동안 물을 적게"
    source: "https://www.nongsaro.go.kr/portal/ps/psz/psza/contentMain.ps?menuId=PS04108"
    checkedAt: "2026-11-15"
  - id: F2
    value: "겨울엔 배수구멍으로 물이 나오자마자 멈추고 30분 후 받침 물 버림. 아침에 물 주기(밤 물방울은 반점·썩음 원인). 토분이 플라스틱보다 잦은 물주기. 손가락으로 1~2cm 깊이 확인. 과다관수 시 뿌리 썩으면 금방 쓰러짐"
    source: "https://www.nongsaro.go.kr/portal/ps/psz/psza/contentMain.ps?menuId=PS04108"
    checkedAt: "2026-11-15"
  - id: F3
    value: "대부분 다육식물 베란다 최저 10℃ 이상이면 뿌리 활동, 냉해 없이 월동 가능 온도 평균 5℃, 5℃ 이하 1~2℃면 냉해 가능해 방한 필요, 10월 말까지 실외 적응 개체는 1~2℃에서도 관리 가능"
    source: "https://www.rwn.co.kr/news/articleView.html?idxno=70638"
    checkedAt: "2026-11-15"
  - id: F4
    value: "초겨울 물 간격 봄·가을의 2~3배, 베란다 5℃ 이하 한겨울엔 단수, 건조한 다육이가 추위 저항성 강함, 5℃ 이하 뿌리 활동 둔화"
    source: "https://www.rwn.co.kr/news/articleView.html?idxno=70638"
    checkedAt: "2026-11-15"
  - id: F5
    value: "실내 월동 시 웃자람 방지에 필름 없는 투명 유리창 직광 4시간 이상, 부족하면 식물용 LED, 광원 40cm 이상이면 효과 미미하니 20~30cm"
    source: "https://www.rwn.co.kr/news/articleView.html?idxno=70638"
    checkedAt: "2026-11-15"
  - id: F6
    value: "다육식물 적정습도 평균 30% 이하, 겨울 베란다 결로로 과습 잦아 낮에 환기, 환기 후 창문 잠금 확인"
    source: "https://www.rwn.co.kr/news/articleView.html?idxno=70638"
    checkedAt: "2026-11-15"
