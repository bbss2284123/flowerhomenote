facts:
  - id: F1
    value: "일반 곰팡이 제거: 시판 곰팡이 제거 제품 사용 또는 물 약 3.8리터에 표백제 1컵 이하. 암모니아가 첨가된 표백제는 유독가스 위험으로 사용 금지. 실리콘 이음새 곰팡이는 락스나 곰팡이 제거제를 분무기로 뿌린 뒤 하루 동안 티슈를 붙여 두었다 떼어 제거. 곰팡이 청소 시 마스크 착용 권장. 과자 건조제를 부직포 주머니에 담아 욕실에 걸면 습기 제거에 도움"
    source: "https://www.ehtis.or.kr/cmn/sym/mnu/mpm/111021211/htmlCnView.do"
    checkedAt: "2026-11-20"
    note: "환경보건포털 실내공기_곰팡이, 출처 환경부 「생활 속 곰팡이 이렇게 관리하세요」"
  - id: F2
    value: "곰팡이 핀 표면에 페인트나 코킹을 하지 말 것(청소·건조 후). 다공성 재료는 곰팡이가 틈을 채워 완전 제거가 어렵거나 불가능할 수 있음. 긴 장갑 권장. 표백제와 암모니아 함유 세제 혼합 금지, 환기"
    source: "https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home"
    checkedAt: "2026-11-20"
  - id: F3
    value: "표백제(차아염소산나트륨)와 산(식초, 일부 유리 세정제, 변기 세정제, 배수구 세정제, 녹 제거제 등)을 섞으면 염소가스 발생. 암모니아·산·다른 세정제와 섞지 말 것"
    source: "https://doh.wa.gov/community-and-environment/contaminants/bleach-mixing-dangers"
    checkedAt: "2026-11-20"
  - id: F4
    value: "표백제와 산을 섞으면 염소가스. 장갑 착용, 환기되는 곳에서 사용, 흡입 시 즉시 신선한 공기로 이동하고 호흡이 힘들면 진료"
    source: "https://www.poison.org/articles/chlorine-gas"
    checkedAt: "2026-11-20"
