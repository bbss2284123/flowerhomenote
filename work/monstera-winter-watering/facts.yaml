facts:
  - id: F1
    value: "몬스테라 생육적온 16~20℃, 겨울최저온도 13℃ 이상, 습도 70% 이상, 광요구도 중간~높은 광도(800~10,000 Lux), 배치 거실 창측·발코니 내측·창측"
    source: "https://nongsaro.go.kr/portal/ps/psz/psza/contentSub.ps?cntntsNo=16449&menuId=PS00376&totalSearchYn=Y"
    checkedAt: "2026-11-21"
  - id: F2
    value: "물주기 봄·여름·가을 흙을 촉촉하게 유지(물에 잠기지 않도록), 겨울 토양 표면이 말랐을 때 충분히 관수; 따뜻한 물 사용; 비료 봄·여름 수용성 비료 2주에 한 번"
    source: "https://nongsaro.go.kr/portal/ps/psz/psza/contentSub.ps?cntntsNo=16449&menuId=PS00376&totalSearchYn=Y"
    checkedAt: "2026-11-21"
  - id: F3
    value: "병충해 응애·깍지벌레, 독성 식물체(어린이 주변에 두지 말 것), 번식 파종·삽목, 번식시기 여름"
    source: "https://nongsaro.go.kr/portal/ps/psz/psza/contentSub.ps?cntntsNo=16449&menuId=PS00376&totalSearchYn=Y"
    checkedAt: "2026-11-21"
  - id: F4
    value: "배수 구멍 없는 용기는 과습 위험, 자신 없으면 배수 구멍 있는 화분"
    source: "https://www.nongsaro.go.kr/portal/ps/psz/psza/contentMain.ps?menuId=PS04108"
    checkedAt: "2026-11-21"
  - id: F5
    value: "Cutleaf Philodendron (Monstera deliciosa) 개·고양이 독성, 불용성 옥살산칼슘; 입 자극·통증, 침 흘림, 구토, 삼키기 어려움"
    source: "https://www.aspca.org/pet-care/aspca-poison-control/toxic-and-non-toxic-plants/cutleaf-philodendron"
    checkedAt: "2026-11-21"
